name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      versionCode: ${{ steps.resolve.outputs.versionCode }}
    steps:
      - name: Resolve version from the release tag
        id: resolve
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag '${TAG}' is not a vMAJOR.MINOR.PATCH release tag." >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          # Derived from the version itself so it only ever grows and never has to be
          # remembered. The scheme this replaces counted tags, which had already drifted
          # a version behind; 0.0.13 lands on 13, safely above the 11 last shipped.
          code=$(( major * 10000 + minor * 100 + patch ))
          echo "version=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "versionCode=${code}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${TAG} as versionCode ${code}"

  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The release build comes from the tag itself, not from whatever main has
          # moved on to since.
          - variant: main
            ref: ${{ github.ref_name }}
            suffix: ""
          - variant: dev
            ref: dev
            suffix: "-dev"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 1

      - name: Align version for build
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}${{ matrix.suffix }}"
          code="${{ needs.version.outputs.versionCode }}"
          sed -i -E "s/(versionName\s*=\s*)\"[^\"]+\"/\1\"${version}\"/" app/build.gradle.kts
          sed -i -E "s/(versionCode\s*=\s*)[0-9]+/\1${code}/" app/build.gradle.kts
          grep -E 'versionName|versionCode' app/build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is not set" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/anyapk-release.keystore
          umask 077
          cat > keystore.properties <<EOF
          storeFile=anyapk-release.keystore
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Stage APKs with release names
        run: |
          set -euo pipefail
          mkdir -p release
          # One APK per ABI plus the universal fallback. UpdateChecker.selectAsset()
          # matches on the trailing -<abi>.apk, so the suffix here is load-bearing:
          # renaming these silently breaks in-app updates.
          # A branch that predates the ABI split emits a single app-release.apk instead.
          # That build carries every ABI, so it is the universal one by definition. The
          # dev variant builds from the dev branch rather than from the tag, so it lags
          # main by design and this is a normal state, not a failure.
          shopt -s nullglob
          staged=0
          for src in app/build/outputs/apk/release/app-*-release.apk \
                     app/build/outputs/apk/release/app-release.apk; do
            # app-release.apk is a literal, not a pattern, so nullglob does not drop it
            # when the build did produce splits.
            [ -f "$src" ] || continue
            case "$src" in *-unsigned*) continue;; esac
            abi=$(basename "$src"); abi=${abi#app-}; abi=${abi%release.apk}
            abi=${abi%-}; abi=${abi:-universal}
            cp "$src" "release/anyapk${{ matrix.suffix }}-${{ needs.version.outputs.version }}-${abi}.apk"
            staged=$((staged + 1))
          done
          if [ "$staged" -eq 0 ]; then
            echo "No release APKs were produced" >&2
            exit 1
          fi
          ls -la release/

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.variant }}
          path: release/*.apk
          retention-days: 7
          if-no-files-found: error

      - name: Clean up signing material
        if: always()
        run: rm -f app/anyapk-release.keystore keystore.properties

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download main APK
        uses: actions/download-artifact@v4
        with:
          name: apk-main
          path: release

      - name: Download dev APK
        uses: actions/download-artifact@v4
        with:
          name: apk-dev
          path: release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          # The tag already exists and already points at the right commit, so there is
          # nothing left to place — this only attaches the build to it.
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/anyapk-${{ needs.version.outputs.version }}-*.apk
            release/anyapk-dev-${{ needs.version.outputs.version }}-*.apk
